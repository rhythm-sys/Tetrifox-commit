services:
  app:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - parcel-data:/app/data
      - ./routing-rules.json:/app/routing-rules.json:ro
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_PATH: /app/data/parcel-routing.db
      RULES_PATH: ../../routing-rules.json
      ALLOWED_ORIGINS: http://localhost:3001
      LOG_LEVEL: info
      RATE_LIMIT_MAX: 200
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  parcel-data:
